<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYNCPAGO — Recuperar contraseña</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
</head>
<body>

<div class="auth-screen">
  <div class="auth-inner">

    <header class="auth-logo" role="banner">
      SYNC<span>PAGO</span>
    </header>

    <main>
      <section class="auth-card" aria-label="Recuperar contraseña">
        <h1>Recuperar contraseña</h1>

        <div class="info-box" role="note">
          📧 Ingresa tu correo registrado y te enviaremos un enlace para restablecer tu contraseña.
        </div>

        <div class="field-group" id="fg-email">
          <span class="icon" aria-hidden="true">✉</span>
          <input type="email" id="email" placeholder="Correo electrónico"
                 autocomplete="email" aria-label="Correo electrónico">
          <p class="field-error" role="alert">Ingresa un correo válido.</p>
        </div>

        <button class="btn-primary" onclick="handleForgot()">Enviar enlace</button>

        <div id="success-msg" class="hidden" role="status" style="
          margin-top:14px;
          background:#dcfce7;
          border-radius:8px;
          padding:12px 14px;
          font-size:0.85rem;
          color:#16a34a;
          text-align:center;">
          ✅ Enlace enviado. Revisa tu bandeja de entrada.
        </div>
      </section>

      <p class="auth-link">
        <a href="index.html">← Volver al inicio de sesión</a>
      </p>
    </main>

  </div>
</div>

<script src="../js/auth.js"></script>
<script>
  function handleForgot() {
    const email = document.getElementById("email");
    const fg    = document.getElementById("fg-email");

    if (!email.value.includes("@")) {
      fg.classList.add("error");
      return;
    }
    fg.classList.remove("error");

    forgotPassword(email.value);
    document.getElementById("success-msg").classList.remove("hidden");

    document.querySelector(".btn-primary").disabled = true;
    document.querySelector(".btn-primary").textContent = "Enlace enviado";
  }
</script>

</body>
</html>
